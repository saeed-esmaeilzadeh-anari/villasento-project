name: Build and type validation

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  next-app:
    name: Next.js frontend and API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./db/ci.db
      AUTH_SECRET: ci-only-not-for-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Persist synchronized npm lockfile
        run: |
          if [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: synchronize npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Run TypeScript validation
        run: npm run typecheck
      - name: Build frontend and API
        run: npm run build

  nest-backend:
    name: Legacy NestJS backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: mini-services/vilasa-backend
      - name: Generate NestJS Prisma Client
        run: bun run db:generate
        working-directory: mini-services/vilasa-backend
      - name: Build NestJS backend
        run: bun run build
        working-directory: mini-services/vilasa-backend
